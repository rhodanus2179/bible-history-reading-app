<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#143c42">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="聖書365">
    <title>聖書の歴史を旅する365日 v1.3.0</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topin">
        <div class="brand">聖書の歴史を旅する365日</div>
        <div class="header-progress" id="headerProgress"></div>
        <button type="button" class="iconbtn" id="themeBtn" aria-label="テーマ切替">◐</button>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="メインナビゲーション"></aside>
      <main class="main">
        <section id="today" class="view active"></section>
        <section id="plan" class="view"></section>
        <section id="history" class="view"></section>
        <section id="notes" class="view"></section>
        <section id="settings" class="view"></section>
      </main>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="モバイルナビゲーション"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span id="toastMessage"></span>
      <button type="button" class="toast-action" id="toastAction" hidden></button>
    </div>
    <script src="data/plan-01.js"></script>
    <script src="data/plan-02.js"></script>
    <script src="data/plan-03.js"></script>
    <script src="data/plan-04.js"></script>
    <script src="data/books.js"></script>
    <script src="js/app-core.js"></script>
    <script src="js/app-ui.js"></script>
  </body>
</html>
